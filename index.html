<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forest Coin Hunt</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb8a8; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 12px; color: #fff; font-size: 18px; font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none;
    }
    #sense { margin-top: 6px; font-size: 15px; }
    #crosshair {
      position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
      border-radius: 50%; background: rgba(255,255,255,.8); pointer-events: none;
    }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10,25,15,.55);
    }
    #overlay.hidden { display: none; }
    .panel {
      background: rgba(20,35,25,.92); color: #eef; padding: 28px 32px; border-radius: 12px;
      max-width: 420px; text-align: center; line-height: 1.5;
    }
    .panel h1 { margin: 0 0 8px; color: #ffd54a; }
    .panel button {
      margin-top: 14px; font-size: 18px; padding: 10px 28px; border: 0; border-radius: 8px;
      background: #ffd54a; color: #222; font-weight: 700; cursor: pointer;
    }
    kbd { background: #334; border-radius: 4px; padding: 1px 6px; font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div>Coins: <span id="count">0</span> / <span id="total">0</span> &nbsp; Time: <span id="time">0.0</span>s</div>
    <div id="sense"></div>
  </div>
  <div id="crosshair"></div>
  <div id="overlay">
    <div class="panel">
      <h1 id="title">Forest Coin Hunt</h1>
      <p id="msg">Find all the gold coins hidden in the forest as fast as you can.</p>
      <p>
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot; mouse look<br>
        <kbd>Shift</kbd> run &middot; <kbd>Space</kbd> jump &middot; <kbd>Esc</kbd> pause<br>
        Arrow keys also turn and move.
      </p>
      <button id="start">Play</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
